# Remote-write credential of the target Prometheus (standalone monitoring option).
# Applied by workflows/scripts/helm-addons.sh (component monitoring) BEFORE the kps
# release: the Prometheus Operator does not create the Prometheus pod while a
# Secret it references is missing. The Vault Secrets Operator on this cluster
# (VaultAuth tpg-vault/tpg-vault, auth/k8s-<cluster>, role tpg-vso, policy
# tpg-target) keeps Secret monitoring/tpg-remote-write (username, password) in
# step with Vault tpg/shared/monitoring-remote-write. Not part of the
# kustomization, which needs the kps CRDs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpg-vso
  namespace: monitoring
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tpg-remote-write
  namespace: monitoring
  labels:
    tpg.fleet/managed: "true"
spec:
  vaultAuthRef: tpg-vault/tpg-vault
  type: kv-v2
  mount: tpg
  path: shared/monitoring-remote-write
  refreshAfter: 60s
  destination:
    name: tpg-remote-write
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
