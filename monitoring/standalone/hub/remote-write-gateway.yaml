# Remote-write gateway on the hub (standalone monitoring option).
#
# The target Prometheus agents send their samples here: https on port 8443 with
# basic auth, forwarded to the hub Prometheus remote-write receiver
# (prometheus-operated:9090/api/v1/write). Only /api/v1/write is forwarded; the
# Prometheus query API is not reachable through the gateway.
#
# Created by tpg-aks-infra scripts/steps/45-helm-addons.sh before this is applied:
#   Service monitoring/tpg-remote-write        LoadBalancer, internal or public
#                                              (inventory monitoring.remoteWriteExposure)
#   Secret  monitoring/tpg-remote-write-tls    server certificate signed by the Vault CA
#   Secret  monitoring/tpg-remote-write-htpasswd  apr1 hash of the credential in Vault
#                                              (tpg/shared/monitoring-remote-write)
apiVersion: v1
kind: ConfigMap
metadata:
  name: tpg-remote-write-nginx
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tpg-remote-write
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {
      worker_connections 1024;
    }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      access_log /dev/stdout;
      server_tokens off;
      # Resolved per request, so the gateway starts even before Prometheus exists
      resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
      server {
        listen 8443 ssl;
        ssl_certificate /etc/tpg/tls/tls.crt;
        ssl_certificate_key /etc/tpg/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 64m;
        location = /api/v1/write {
          auth_basic "tpg remote write";
          auth_basic_user_file /etc/tpg/auth/htpasswd;
          set $upstream http://prometheus-operated.monitoring.svc.cluster.local:9090;
          proxy_pass $upstream;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_read_timeout 60s;
        }
        location = /healthz {
          access_log off;
          return 200 "ok\n";
        }
        location / {
          return 404;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpg-remote-write
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tpg-remote-write
    app.kubernetes.io/part-of: tpg-fleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tpg-remote-write
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tpg-remote-write
        app.kubernetes.io/part-of: tpg-fleet
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          args: ["nginx", "-c", "/etc/tpg/nginx/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/tpg/nginx
              readOnly: true
            - name: tls
              mountPath: /etc/tpg/tls
              readOnly: true
            - name: auth
              mountPath: /etc/tpg/auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: tpg-remote-write-nginx
        - name: tls
          secret:
            secretName: tpg-remote-write-tls
        - name: auth
          secret:
            secretName: tpg-remote-write-htpasswd
        - name: tmp
          emptyDir: {}
