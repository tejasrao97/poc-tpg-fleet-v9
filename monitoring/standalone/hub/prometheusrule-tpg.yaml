# GENERATED by monitoring/grafana/generate.py - do not edit by hand.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tpg-rules
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:
  - name: tanzu-postgres
    rules:
    - alert: TanzuPostgresInstanceNotRunning
      expr: (1 - max by (cluster, instance_namespace, instance_name) (tanzu_postgres_instance_state{state="Running"})) > 0
      labels:
        severity: critical
      annotations:
        summary: "{{ $labels.cluster }}/{{ $labels.instance_name }} is not in the Running state"
      for: 5m
    - alert: TanzuPostgresInstanceCountDropped
      expr: (count by (cluster) (tanzu_postgres_instance_state{state="Running"} offset 1h) - count by (cluster) (tanzu_postgres_instance_state{state="Running"})) > 0
      labels:
        severity: warning
      annotations:
        summary: "Fewer Postgres instances on {{ $labels.cluster }} than one hour ago"
    - alert: TanzuPostgresReplicasBelowDesired
      expr: (max by (cluster, namespace, statefulset) (kube_statefulset_replicas{namespace=~"pg-.*"}) - max by (cluster, namespace, statefulset) (kube_statefulset_status_replicas_ready{namespace=~"pg-.*"})) > 0
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.cluster }}/{{ $labels.statefulset }} has fewer ready pods than desired"
      for: 10m
    - alert: TanzuPostgresBackupFailed
      expr: (count by (cluster, instance_namespace, instance_name) ((tanzu_postgres_backup_phase{phase="Failed"} == 1) and on (cluster, instance_namespace, backup_name) ((time() - tanzu_postgres_backup_created_timestamp) < 86400))) > 0
      labels:
        severity: critical
      annotations:
        summary: "A backup of {{ $labels.cluster }}/{{ $labels.instance_name }} failed in the last 24 hours"
    - alert: TanzuPostgresBackupRunningLong
      expr: (max by (cluster, instance_namespace, instance_name, backup_name) (tanzu_postgres_backup_phase{phase="Running"})) > 0
      labels:
        severity: warning
      annotations:
        summary: "Backup {{ $labels.backup_name }} on {{ $labels.cluster }} has been running for more than 3 hours"
      for: 3h
    - alert: TanzuPostgresNoRecentBackup
      expr: ((time() - max by (cluster, instance_namespace, instance_name) (tanzu_postgres_backup_completed_timestamp and on (cluster, instance_namespace, backup_name) (tanzu_postgres_backup_phase{phase="Succeeded"} == 1))) / 3600) > 26
      labels:
        severity: critical
      annotations:
        summary: "No successful backup of {{ $labels.cluster }}/{{ $labels.instance_name }} for more than 26 hours"
    - alert: TanzuPostgresBackupSkipped
      expr: (sum by (cluster, instance_name) (increase(argo_workflows_tpg_backup_result_total{result="SKIPPED_IN_PROGRESS"}[1h]))) > 0
      labels:
        severity: warning
      annotations:
        summary: "The backup workflow skipped {{ $labels.cluster }}/{{ $labels.instance_name }} because the previous backup was still running"
    - alert: TanzuPostgresRestoreFailed
      expr: (count by (cluster, instance_namespace, target_instance) ((tanzu_postgres_restore_phase{phase="Failed"} == 1) and on (cluster, instance_namespace, restore_name) ((time() - tanzu_postgres_restore_created_timestamp) < 86400))) > 0
      labels:
        severity: critical
      annotations:
        summary: "A restore to {{ $labels.cluster }}/{{ $labels.target_instance }} failed in the last 24 hours"
    - alert: TanzuPostgresReplicationLag
      expr: (max by (cluster, postgres_instance) (pg_replication_lag_seconds)) > 30
      labels:
        severity: warning
      annotations:
        summary: "Replication lag on {{ $labels.cluster }}/{{ $labels.postgres_instance }} is above 30 seconds"
      for: 5m
    - alert: TanzuPostgresWalArchivingFailing
      expr: (sum by (cluster, postgres_instance) (increase(pg_stat_archiver_failed_count[15m]))) > 0
      labels:
        severity: critical
      annotations:
        summary: "WAL archiving is failing on {{ $labels.cluster }}/{{ $labels.postgres_instance }}; point-in-time recovery is at risk"
    - alert: TanzuPostgresConnectionsHigh
      expr: (sum by (cluster, postgres_instance) (pg_stat_activity_count) / max by (cluster, postgres_instance) (pg_settings_max_connections)) > 0.8
      labels:
        severity: warning
      annotations:
        summary: "{{ $labels.cluster }}/{{ $labels.postgres_instance }} uses more than 80% of max_connections"
      for: 10m
    - alert: TanzuPostgresDeleteFailed
      expr: (sum by (cluster, instance_name) (increase(argo_workflows_tpg_delete_result_total{result!="SUCCEEDED"}[1h]))) > 0
      labels:
        severity: warning
      annotations:
        summary: "A delete of {{ $labels.cluster }}/{{ $labels.instance_name }} did not succeed; the instance may be half deleted"
    - alert: TanzuPostgresVaultSealed
      expr: ((1 - max(vault_core_unsealed)) or absent(vault_core_unsealed)) > 0
      labels:
        severity: critical
      annotations:
        summary: "Vault on the hub is sealed (or its metrics are missing): workflows fail with VAULT_SEALED and secrets are not refreshed. Unseal it with tpg-aks-infra scripts/run.sh ... --only vault-unseal"
      for: 2m
    - alert: TanzuPostgresExporterDown
      expr: (1 - max by (cluster, postgres_instance) (up{postgres_instance!=""})) > 0
      labels:
        severity: warning
      annotations:
        summary: "postgres-exporter on {{ $labels.cluster }}/{{ $labels.postgres_instance }} cannot be scraped"
      for: 5m
