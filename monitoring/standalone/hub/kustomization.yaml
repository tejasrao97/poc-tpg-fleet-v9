apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - servicemonitor-argo-workflows.yaml
  - servicemonitor-vault.yaml
  - prometheusrule-tpg.yaml
  - remote-write-gateway.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  # The Grafana dashboard sidecar puts every dashboard into this folder
  # (grafana.sidecar.dashboards.folderAnnotation in kps-values.yaml)
  annotations:
    grafana_folder: Tanzu Postgres
configMapGenerator:
  # Generated by monitoring/grafana/generate.py
  - name: tpg-fleet-dashboard
    files:
      - dashboards/tpg-fleet.json
  - name: tpg-instance-dashboard
    files:
      - dashboards/tpg-instance.json
  - name: tpg-replication-dashboard
    files:
      - dashboards/tpg-replication.json
  - name: tpg-backup-dashboard
    files:
      - dashboards/tpg-backup.json
  - name: tpg-alerts-dashboard
    files:
      - dashboards/tpg-alerts.json
