# One operator Application per cluster: tpg-<cluster>-operator.
#
# Generated only for registered clusters (label tpg.fleet/managed=true) that
# have clusters.<cluster>.operator.version in clusters/fleet.yaml. tpg-day0 and
# tpg-upgrade (component=operator) write that version; tpg-delete-apps removes it.
#
# Two sources (multi-source Application):
#   1. the operator chart from the Broadcom OCI registry, at the declared version
#   2. the fleet repository as the reference "fleet", so the chart can take value
#      files from it: clusters.<cluster>.operator.patches.values in fleet.yaml
#      (tpg-patch operatorValuesPatchFilePath, files under patches/operator/),
#      loaded as $fleet/<path> in list order
# The sources are set by templatePatch, because a list of value files cannot be
# written as a template string.
#
# Operator manifest patches (clusters.<cluster>.operator.patches.manifests,
# tpg-patch operatorManifestPatchFilePath) change fields the chart values do not
# expose. The workflows apply them to the target with server-side apply as field
# manager tpg-patch; this Application ignores the fields that manager owns
# (managedFieldsManagers) and, with RespectIgnoreDifferences, keeps their live
# values in every sync (Argo CD v3.5.3 controller/sync.go normalizeTargetResources).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tpg-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - clusters:
                    selector:
                      matchLabels:
                        tpg.fleet/managed: "true"
                - git:
                    repoURL: https://github.com/tejasrao97/poc-tpg-fleet-v9.git
                    revision: main
                    files:
                      - path: clusters/fleet.yaml
          - list:
              # [{"operatorVersion": "<tag>", "valueFiles": [...]}] when the cluster declares a version, otherwise []
              elementsYaml: >-
                {{- $version := dig "clusters" .name "operator" "version" "" . -}}
                {{- $files := dig "clusters" .name "operator" "patches" "values" (list) . -}}
                {{- if $version -}}{{- toJson (list (dict "operatorVersion" $version "valueFiles" $files)) -}}{{- else -}}[]{{- end -}}
  template:
    metadata:
      name: "tpg-{{.name}}-operator"
      labels:
        tpg.fleet/cluster: "{{.name}}"
        tpg.fleet/wave: '{{index .metadata.labels "tpg.fleet/wave"}}'
        tpg.fleet/component: operator
    spec:
      project: tpg
      destination:
        server: "{{.server}}"
        namespace: tanzu-postgres-operator
      ignoreDifferences:
        - group: "*"
          kind: "*"
          managedFieldsManagers:
            - tpg-patch
      # No "automated" block by design: the workflows decide when to sync.
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
  templatePatch: |
    spec:
      sources:
        - repoURL: tanzu-sql-postgres.packages.broadcom.com
          chart: vmware-sql-postgres-operator
          targetRevision: {{ .operatorVersion | quote }}
          helm:
            valuesObject:
              dockerRegistrySecretName: regsecret
            {{- if .valueFiles }}
            valueFiles:
            {{- range .valueFiles }}
              - {{ printf "$fleet/%s" . | quote }}
            {{- end }}
            {{- end }}
        - repoURL: https://github.com/tejasrao97/poc-tpg-fleet-v9.git
          targetRevision: main
          ref: fleet
