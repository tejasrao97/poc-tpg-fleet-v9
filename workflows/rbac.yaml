# ServiceAccount used by every tpg workflow (controller.workflowDefaults in the
# hub Argo Workflows values sets it as the default).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpg-workflow
  namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpg-workflow
  namespace: argo
rules:
  # Argo Workflows executor
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "watch"]
  # Run results (tpg-run-*) and settings (tpg-settings)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  # kubeconfig-<cluster>, argocd-workflow-token, vault-ca. The credentials
  # themselves come from Vault (Vault Agent, role tpg-workflow).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpg-workflow
  namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpg-workflow
subjects:
  - kind: ServiceAccount
    name: tpg-workflow
    namespace: argo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpg-workflow
  namespace: argocd
rules:
  # Refresh ApplicationSets after a Git commit (operator version changes)
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "list", "patch"]
  # Credential rotation checks: the repository Secrets are synced from Vault by
  # the Vault Secrets Operator (VaultStaticSecrets); the workflows only read them
  - apiGroups: ["secrets.hashicorp.com"]
    resources: ["vaultstaticsecrets"]
    resourceNames: ["repo-tanzu-postgres-oci", "repo-tpg-fleet"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpg-workflow
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpg-workflow
subjects:
  - kind: ServiceAccount
    name: tpg-workflow
    namespace: argo
