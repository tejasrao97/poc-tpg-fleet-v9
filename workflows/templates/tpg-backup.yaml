# Day 1: guarded backup of the selected Postgres instances (clusterMap, or the clusters and
# instances inputs; default every instance of every cluster). Skips an instance whose previous
# backup is still running after a 2-minute wait.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tpg-backup
  namespace: argo
  annotations:
    workflows.argoproj.io/description: >-
      Day 1: guarded backup of every Postgres instance on the selected clusters. Skips an instance whose previous backup is still running after a 2-minute wait.
spec:
  serviceAccountName: tpg-workflow
  # Vault Agent (injector on the hub) renders tpg/shared/broadcom-registry,
  # github-push and backup-storage into /vault/secrets before each step starts
  # (ConfigMap tpg-vault-agent, workflows/vault-agent/config-init.hcl).
  # Steps that need no credentials set agent-inject to "false".
  podMetadata:
    annotations:
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/agent-pre-populate-only: "true"
      vault.hashicorp.com/agent-init-first: "true"
      vault.hashicorp.com/agent-configmap: tpg-vault-agent
      vault.hashicorp.com/tls-secret: vault-ca
  entrypoint: main
  onExit: exit-handler
  parallelism: 10
  arguments:
    parameters:
    - name: backupType
      description: "full (starts a chain), incremental (changes since the previous backup; daily schedule) or differential (changes since the last full; manual)"
      value: "full"
      enum: ["full", "incremental", "differential"]
    - name: clusters
      description: "List: comma-separated registered clusters, or all (without clusterMap)"
      value: "all"
    - name: instances
      description: "List: instances to back up, or all / empty for every instance (without clusterMap)"
      value: ""
    - name: clusterMap
      description: "Map (YAML or JSON): cluster -> {instances: {instance -> {backupType, backupTimeoutSeconds}}}; the inputs are the defaults"
      value: ""
    - name: backupTimeoutSeconds
      value: "10800"
    - name: scheduledOnly
      description: "true (CronWorkflows): skip instances with backup.scheduled false in clusters/fleet.yaml"
      value: "false"
      enum: ["false", "true"]
    - name: toolsImage
      value: alpine/k8s:1.35.8
  volumes:
    - name: scripts
      configMap:
        name: tpg-scripts
        defaultMode: 0755
  templates:
  - name: main
    steps:
    - - name: validate
        template: validate
    - - name: init
        templateRef:
          name: tpg-lib
          template: init-run
    - - name: discover
        templateRef:
          name: tpg-lib
          template: discover
        arguments:
          parameters:
            - name: clusters
              value: "{{steps.validate.outputs.parameters.selection}}"
            - name: filter
              value: any
            - name: instances
              value: "{{workflow.parameters.instances}}"
            - name: clusterMap
              value: "{{workflow.parameters.clusterMap}}"
    - - name: backup
        template: backup-instance
        arguments:
          parameters:
            - name: cluster
              value: "{{item.cluster}}"
            - name: instance
              value: "{{item.instance}}"
            - name: scheduled
              value: "{{item.scheduled}}"
        withParam: "{{steps.discover.outputs.parameters.instanceItems}}"
  - name: validate
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "false"
    outputs:
      parameters:
        - name: selection
          valueFrom:
            path: /tmp/selection
            default: ""
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/validate-params.sh, backup]
      env:
        - {name: P_CLUSTER_MAP, value: "{{workflow.parameters.clusterMap}}"}
        - {name: P_CLUSTERS, value: "{{workflow.parameters.clusters}}"}
        - {name: P_INSTANCES, value: "{{workflow.parameters.instances}}"}
        - {name: P_BACKUP_TYPE, value: "{{workflow.parameters.backupType}}"}
        - {name: P_TIMEOUT, value: "{{workflow.parameters.backupTimeoutSeconds}}"}
        - {name: P_SCHEDULED_ONLY, value: "{{workflow.parameters.scheduledOnly}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: backup-instance
    inputs:
      parameters:
        - name: cluster
        - name: instance
        - name: scheduled
          value: "true"
    outputs:
      parameters:
        - name: result
          valueFrom:
            path: /tmp/result
            default: UNKNOWN
    metrics:
      prometheus:
        - name: tpg_backup_result
          help: "Backup result per instance"
          labels:
            - key: cluster
              value: "{{inputs.parameters.cluster}}"
            - key: instance_name
              value: "{{inputs.parameters.instance}}"
            - key: backup_type
              value: "{{workflow.parameters.backupType}}"
            - key: result
              value: "{{outputs.parameters.result}}"
          counter:
            value: "1"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/backup-instance.sh]
      args:
        - "{{workflow.name}}"
        - "{{inputs.parameters.cluster}}"
        - "{{inputs.parameters.instance}}"
        - "{{workflow.parameters.backupType}}"
        - "{{workflow.parameters.backupTimeoutSeconds}}"
        - "{{inputs.parameters.scheduled}}"
        - "{{workflow.parameters.scheduledOnly}}"
      env:
        # backupType and backupTimeoutSeconds per instance from clusterMap
        - {name: P_CLUSTER_MAP, value: "{{workflow.parameters.clusterMap}}"}
        - {name: BACKUP_FROM_MAP, value: "true"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: exit-handler
    steps:
    - - name: report
        templateRef:
          name: tpg-lib
          template: report
        arguments:
          parameters:
            - name: mode
              value: instance
