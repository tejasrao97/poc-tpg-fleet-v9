# Day 1: verify a credential rotation everywhere the credential is used. Update the value in Vault first (tpg-aks-infra scripts/run.sh --only hub-secrets checks it and writes it); the Vault Secrets Operator and Vault Agent distribute it, and this workflow waits for them and verifies it.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tpg-rotate-credential
  namespace: argo
  annotations:
    workflows.argoproj.io/description: >-
      Day 1: verify a credential rotation everywhere the credential is used. Update the value in Vault
      first (tpg-aks-infra scripts/run.sh --only hub-secrets checks it and writes it); the Vault Secrets
      Operator and Vault Agent distribute it, and this workflow waits for them and verifies it.
spec:
  serviceAccountName: tpg-workflow
  # Vault Agent (injector on the hub) renders tpg/shared/broadcom-registry,
  # github-push and backup-storage into /vault/secrets before each step starts
  # (ConfigMap tpg-vault-agent, workflows/vault-agent/config-init.hcl).
  # Steps that need no credentials set agent-inject to "false".
  podMetadata:
    annotations:
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/agent-pre-populate-only: "true"
      vault.hashicorp.com/agent-init-first: "true"
      vault.hashicorp.com/agent-configmap: tpg-vault-agent
      vault.hashicorp.com/tls-secret: vault-ca
  entrypoint: main
  onExit: exit-handler
  parallelism: 20
  arguments:
    parameters:
    - name: secretType
      description: >-
        broadcom-registry (Argo CD Helm repository, regsecret on every target, image pull test),
        backup-storage (backup-storage on every target, backup locations, container access),
        git-push (workflow clone and push) or git-read (Argo CD fleet repository)
      value: "broadcom-registry"
      enum: ["broadcom-registry", "backup-storage", "git-push", "git-read"]
    - name: clusters
      value: "all"
    - name: maxParallel
      value: "5"
    - name: toolsImage
      value: alpine/k8s:1.35.8
  volumes:
    - name: scripts
      configMap:
        name: tpg-scripts
        defaultMode: 0755
  templates:
  - name: main
    steps:
    - - name: init
        templateRef:
          name: tpg-lib
          template: init-run
    - - name: discover
        templateRef:
          name: tpg-lib
          template: discover
        when: "'{{workflow.parameters.secretType}}' == 'broadcom-registry' || '{{workflow.parameters.secretType}}' == 'backup-storage'"
        arguments:
          parameters:
            - name: clusters
              value: "{{workflow.parameters.clusters}}"
    - - name: hub
        template: rotate-hub
    - - name: plan
        templateRef:
          name: tpg-lib
          template: plan-batches
        when: "'{{workflow.parameters.secretType}}' == 'broadcom-registry' || '{{workflow.parameters.secretType}}' == 'backup-storage'"
        arguments:
          parameters:
            - name: requirePrecheck
              value: "false"
            - name: maxParallel
              value: "{{workflow.parameters.maxParallel}}"
    - - name: rotate
        template: run-batches
        when: "('{{workflow.parameters.secretType}}' == 'broadcom-registry' || '{{workflow.parameters.secretType}}' == 'backup-storage') && {{steps.plan.outputs.parameters.hasBatches}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.plan.outputs.parameters.batches}}"
  - name: run-batches
    inputs:
      parameters:
        - name: batches
    steps:
    - - name: split
        templateRef:
          name: tpg-lib
          template: split-first
        arguments:
          parameters:
            - name: batches
              value: "{{inputs.parameters.batches}}"
    - - name: batch
        template: rotate-cluster
        arguments:
          parameters:
            - name: cluster
              value: "{{item}}"
        withParam: "{{steps.split.outputs.parameters.first}}"
    - - name: next
        template: run-batches
        when: "{{steps.split.outputs.parameters.hasRest}} == true"
        arguments:
          parameters:
            - name: batches
              value: "{{steps.split.outputs.parameters.rest}}"
  - name: rotate-hub
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/rotate-hub.sh]
      args:
        - "{{workflow.name}}"
        - "{{workflow.parameters.secretType}}"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: rotate-cluster
    inputs:
      parameters:
        - name: cluster
    outputs:
      parameters:
        - name: result
          valueFrom:
            path: /tmp/result
            default: UNKNOWN
    metrics:
      prometheus:
        - name: tpg_rotation_result
          help: "Credential rotation result per cluster"
          labels:
            - key: cluster
              value: "{{inputs.parameters.cluster}}"
            - key: secret_type
              value: "{{workflow.parameters.secretType}}"
            - key: result
              value: "{{outputs.parameters.result}}"
          counter:
            value: "1"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/rotate-cluster.sh]
      args:
        - "{{workflow.name}}"
        - "{{inputs.parameters.cluster}}"
        - "{{workflow.parameters.secretType}}"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: exit-handler
    steps:
    - - name: report
        templateRef:
          name: tpg-lib
          template: report
        arguments:
          parameters:
            - name: mode
              value: cluster
