# Day 1: scale the read replicas of Postgres instances. Targets: clusterMap (replicas
# per instance) or the instances list on every cluster of the clusters list. The new
# counts are written to clusters/fleet.yaml in one commit (pushMode direct or pr), then
# each instance is synced and verified.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: tpg-scale-instance
  namespace: argo
  annotations:
    workflows.argoproj.io/description: >-
      Day 1: scale the read replicas of Postgres instances on one or more clusters (clusterMap,
      or clusters and instances lists). The new counts are written to clusters/fleet.yaml in
      one commit, then every instance is synced and verified.
spec:
  serviceAccountName: tpg-workflow
  # Vault Agent (injector on the hub) renders tpg/shared/broadcom-registry,
  # github-push and backup-storage into /vault/secrets before each step starts
  # (ConfigMap tpg-vault-agent, workflows/vault-agent/config-init.hcl).
  # Steps that need no credentials set agent-inject to "false".
  podMetadata:
    annotations:
      vault.hashicorp.com/agent-inject: "true"
      vault.hashicorp.com/agent-pre-populate-only: "true"
      vault.hashicorp.com/agent-init-first: "true"
      vault.hashicorp.com/agent-configmap: tpg-vault-agent
      vault.hashicorp.com/tls-secret: vault-ca
  entrypoint: main
  onExit: exit-handler
  parallelism: 10
  arguments:
    parameters:
    # ---- targets: clusters and instances, or clusterMap (one of the two)
    - name: clusters
      description: "List: comma-separated registered clusters (without clusterMap)"
      value: ""
    - name: instances
      description: "List: instances to scale on every listed cluster; each must be declared there (without clusterMap)"
      value: ""
    - name: clusterMap
      description: "Map (YAML or JSON): cluster -> {instances: {instance -> {replicas, enableHAIfNeeded}}}; the inputs below are the defaults"
      value: ""
    # ---- mandatory without clusterMap (with it: the map key or the input)
    - name: replicas
      description: "Integer: read replicas (0 to maxReadReplicas, default maximum 3)"
      value: ""
    - name: pushMode
      description: "direct: push to the fleet branch; pr: open a pull request and continue after it is merged"
      value: ""
      enum: ["", "direct", "pr"]
    # ---- optional
    - name: enableHAIfNeeded
      description: "replicas > 0 on an instance without high availability: turn it on (true) or fail (false)"
      value: "true"
      enum: ["true", "false"]
    - name: dryRun
      value: "false"
      enum: ["false", "true"]
    - name: timeoutSeconds
      value: "900"
    - name: prTimeoutSeconds
      value: "3600"
    - name: toolsImage
      value: alpine/k8s:1.35.8
  volumes:
    - name: scripts
      configMap:
        name: tpg-scripts
        defaultMode: 0755
  templates:
  - name: main
    steps:
    - - name: validate
        template: validate
    - - name: init
        templateRef:
          name: tpg-lib
          template: init-run
    - - name: discover
        templateRef:
          name: tpg-lib
          template: discover
        arguments:
          parameters:
            - name: clusters
              value: "{{steps.validate.outputs.parameters.selection}}"
            - name: filter
              value: pairs
            - name: instances
              value: "{{workflow.parameters.instances}}"
            - name: clusterMap
              value: "{{workflow.parameters.clusterMap}}"
    - - name: plan
        template: plan
    - - name: scale
        template: scale
        arguments:
          parameters:
            - name: cluster
              value: "{{item.cluster}}"
            - name: instance
              value: "{{item.instance}}"
            - name: replicas
              value: "{{item.replicas}}"
            - name: previous
              value: "{{item.previous}}"
        withParam: "{{steps.plan.outputs.parameters.items}}"
  - name: validate
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "false"
    outputs:
      parameters:
        - name: selection
          valueFrom:
            path: /tmp/selection
            default: ""
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/validate-params.sh, scale]
      env: &scale-env
        - {name: P_CLUSTER_MAP, value: "{{workflow.parameters.clusterMap}}"}
        - {name: P_CLUSTERS, value: "{{workflow.parameters.clusters}}"}
        - {name: P_INSTANCES, value: "{{workflow.parameters.instances}}"}
        - {name: P_REPLICAS, value: "{{workflow.parameters.replicas}}"}
        - {name: P_PUSH_MODE, value: "{{workflow.parameters.pushMode}}"}
        - {name: P_ENABLE_HA, value: "{{workflow.parameters.enableHAIfNeeded}}"}
        - {name: P_DRY_RUN, value: "{{workflow.parameters.dryRun}}"}
        - {name: P_TIMEOUT, value: "{{workflow.parameters.timeoutSeconds}}"}
        - {name: P_PR_TIMEOUT, value: "{{workflow.parameters.prTimeoutSeconds}}"}
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: plan
    outputs:
      parameters:
        - name: items
          valueFrom:
            path: /tmp/items.json
            default: "[]"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/scale-instance.sh, plan]
      args:
        - "{{workflow.name}}"
      env: *scale-env
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: scale
    inputs:
      parameters:
        - name: cluster
        - name: instance
        - name: replicas
        - name: previous
    synchronization:
      mutexes:
        - name: "tpg-instance-{{inputs.parameters.cluster}}-{{inputs.parameters.instance}}"
    outputs:
      parameters:
        - name: result
          valueFrom:
            path: /tmp/result
            default: UNKNOWN
    metrics:
      prometheus:
        - name: tpg_scale_result
          help: "Scaling result per instance"
          labels:
            - key: cluster
              value: "{{inputs.parameters.cluster}}"
            - key: instance_name
              value: "{{inputs.parameters.instance}}"
            - key: result
              value: "{{outputs.parameters.result}}"
          counter:
            value: "1"
    container:
      image: "{{workflow.parameters.toolsImage}}"
      command: [bash, /scripts/scale-instance.sh, apply]
      args:
        - "{{workflow.name}}"
        - "{{inputs.parameters.cluster}}"
        - "{{inputs.parameters.instance}}"
        - "{{workflow.parameters.timeoutSeconds}}"
        - "{{inputs.parameters.replicas}}"
        - "{{inputs.parameters.previous}}"
      env: *scale-env
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  - name: exit-handler
    steps:
    - - name: report
        templateRef:
          name: tpg-lib
          template: report
        arguments:
          parameters:
            - name: mode
              value: steps
