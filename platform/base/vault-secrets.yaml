# Image pull Secret of the Tanzu Postgres operator (chart value
# dockerRegistrySecretName: regsecret), synced from Vault (tpg/shared/broadcom-registry)
# by the Vault Secrets Operator on this cluster. tpg-day0 syncs this platform
# Application before the operator Application.
apiVersion: v1
kind: Namespace
metadata:
  name: tanzu-postgres-operator
  labels:
    tpg.fleet/managed: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpg-vso
  namespace: tanzu-postgres-operator
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: regsecret
  namespace: tanzu-postgres-operator
spec:
  vaultAuthRef: tpg-vault/tpg-vault
  type: kv-v2
  mount: tpg
  path: shared/broadcom-registry
  refreshAfter: 60s
  destination:
    name: regsecret
    create: true
    overwrite: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        .dockerconfigjson:
          # Go template rendered by the Vault Secrets Operator
          text: '{{- $auth := printf "%s:%s" (get .Secrets "username") (get .Secrets "password") | b64enc -}}{"auths":{"tanzu-sql-postgres.packages.broadcom.com":{"username":{{ get .Secrets "username" | toJson }},"password":{{ get .Secrets "password" | toJson }},"auth":"{{ $auth }}"}}}'
