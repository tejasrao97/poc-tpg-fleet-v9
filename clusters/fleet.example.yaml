# Example of a filled-in clusters/fleet.yaml (not read by Argo CD or the
# workflows). tpg-day0 writes these entries; tpg-patch adds the patches lists.
# See clusters/fleet.yaml for the layout.
clusters:
  aks-tpg-poc-01:
    operator:
      version: v4.5.0
      patches:
        manifests:
          - patches/operator/example-operator-placement.yaml
    instances:
      orders-db:
        instance:
          postgresVersion: postgres-17.6
          highAvailability:
            enabled: true
            readReplicas: 1
        patches:
          postgres:
            - patches/example-postgres-resources.yaml
      billing-db:
        instance:
          postgresVersion: postgres-17.6
          highAvailability:
            enabled: false
            readReplicas: 0
        backup:
          scheduled: false
  aks-tpg-poc-02:
    operator:
      version: v4.5.0
    instances:
      orders-db:
        instance:
          postgresVersion: postgres-17.6
          storageSize: 50Gi
        patches:
          values:
            - patches/example-values-backup.yaml
