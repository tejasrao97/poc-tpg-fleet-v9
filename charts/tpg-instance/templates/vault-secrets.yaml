{{- include "tpg.required" . }}
{{- with (include "tpg.ctx" . | fromYaml) }}
# Credentials of this instance, synced from Vault by the Vault Secrets Operator
# (VaultAuth tpg-vault/tpg-vault: auth/k8s-<cluster>, role tpg-vso, policy tpg-target).
# Sync wave -1: Argo CD waits until both Secrets exist (VaultStaticSecret health
# check in argocd-cm) before it creates the backup location and the instance.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpg-vso
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: backup-storage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: {{ .Values.vault.authRef | quote }}
  type: kv-v2
  mount: {{ .Values.vault.mount | quote }}
  path: shared/backup-storage
  refreshAfter: {{ .Values.vault.refreshAfter | quote }}
  destination:
    # Read by the PostgresBackupLocation (accountName, accountKey)
    name: backup-storage
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: regsecret
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  vaultAuthRef: {{ .Values.vault.authRef | quote }}
  type: kv-v2
  mount: {{ .Values.vault.mount | quote }}
  path: shared/broadcom-registry
  refreshAfter: {{ .Values.vault.refreshAfter | quote }}
  destination:
    # Image pull Secret of the Postgres pods (spec.imagePullSecret)
    name: regsecret
    create: true
    overwrite: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        .dockerconfigjson:
          # Go template rendered by the Vault Secrets Operator, not by Helm
          text: {{ printf `{{- $auth := printf "%%s:%%s" (get .Secrets "username") (get .Secrets "password") | b64enc -}}{"auths":{%q:{"username":{{ get .Secrets "username" | toJson }},"password":{{ get .Secrets "password" | toJson }},"auth":"{{ $auth }}"}}}` .Values.registry.host | quote }}
{{- end }}
